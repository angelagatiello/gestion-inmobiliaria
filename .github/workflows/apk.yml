name: Crear APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar herramientas
        run: npm install

      - name: Crear el proyecto de Android
        run: npx cap add android

      - name: Ícono de la app
        continue-on-error: true
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#1D4F91' --iconBackgroundColorDark '#1D4F91'

      - name: Permiso de cámara
        run: sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n</manifest>#' android/app/src/main/AndroidManifest.xml

      - name: Actualizar el proyecto
        run: npx cap sync android

      - name: Usar la llave de firma guardada (si existe)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > ~/.android/debug.keystore
            echo "Se usa la llave de firma guardada."
          else
            echo "AVISO: no hay llave de firma guardada; se crea una nueva."
          fi

      - name: Armar el APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renombrar
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Gestion-Inmobiliaria.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Gestion-Inmobiliaria-apk
          path: Gestion-Inmobiliaria.apk

      - name: Publicar para descargar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-ultima
          name: APK más reciente
          body: Descargá el archivo Gestion-Inmobiliaria.apk de la lista de abajo (Assets) e instalalo en el celular.
          files: Gestion-Inmobiliaria.apk
          make_latest: true
