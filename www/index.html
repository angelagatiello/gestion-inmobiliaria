<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1D4F91"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Inmobiliaria"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" href="icons/icon-192.png"></head><body>
<title>Gestión Inmobiliaria</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<style>
  /* Layout: una sola columna tipo talonario. Arriba el mes y el total a cobrar,
     en el medio las facturas que se cargan, abajo una tarjeta-comprobante por departamento. */
  :root {
    --bg: #EEF2F5;
    --surface: #FFFFFF;
    --surface-2: #F4F7FA;
    --ink: #16222D;
    --muted: #53657A;
    --line: #D3DCE4;
    --accent: #1D4F91;
    --accent-ink: #FFFFFF;
    --accent-soft: #E2ECF8;
    --stamp: #B83232;
    --ok: #1B7550;
    --ok-soft: #DCF2E6;
    --warn: #7F5200;
    --warn-soft: #FAEDCB;
    --danger: #B3261E;
    --bad-soft: #FBE0DD;
    --badge-ink: #FFFFFF;
    --f-display: 'Plus Jakarta Sans', 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --f-body: 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --f-mono: 'Plus Jakarta Sans', 'Atkinson Hyperlegible', system-ui, sans-serif;
    --radius: 18px;
    --c-res: #8A6A2F; --c-news: #8A5A3C; --c-cobros: #4F8A74; --c-contr: #3F6291; --c-cal: #5A6FA0; --c-dep: #3F7F8F; --c-rec: #6E8F6A; --c-ink: #FFFFFF;
    --hero-a: #1D4F91; --hero-b: #2868BA; --glass: rgba(238, 242, 245, .86);
    --shadow: 0 1px 2px rgba(16, 34, 52, .06), 0 10px 28px rgba(16, 34, 52, .08);
    interpolate-size: allow-keywords;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E161E; --surface: #16212B; --surface-2: #1B2833; --ink: #E8EFF5; --muted: #9DB0C1;
      --line: #2B3B49; --accent: #7DB1F0; --accent-ink: #0B1722; --accent-soft: #1B3350; --stamp: #F08080;
      --ok: #5CCB9B; --ok-soft: #17382B; --warn: #E8B65A; --warn-soft: #3A2E12; --danger: #F28B82; --bad-soft: #3F1B18; --badge-ink: #1B0B0B;
      --c-res: #D9B77A; --c-news: #D3A27F; --c-cobros: #7FC0A8; --c-contr: #7FA3D3; --c-cal: #9AAEDB; --c-dep: #7FBBCB; --c-rec: #A3C69C; --c-ink: #0B1722;
      --hero-a: #16406F; --hero-b: #24609F; --glass: rgba(14, 22, 30, .86); --shadow: 0 1px 2px rgba(0, 0, 0, .45), 0 10px 28px rgba(0, 0, 0, .35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E161E; --surface: #16212B; --surface-2: #1B2833; --ink: #E8EFF5; --muted: #9DB0C1;
    --line: #2B3B49; --accent: #7DB1F0; --accent-ink: #0B1722; --accent-soft: #1B3350; --stamp: #F08080;
    --ok: #5CCB9B; --ok-soft: #17382B; --warn: #E8B65A; --warn-soft: #3A2E12; --danger: #F28B82; --bad-soft: #3F1B18; --badge-ink: #1B0B0B;
      --c-res: #D9B77A; --c-news: #D3A27F; --c-cobros: #7FC0A8; --c-contr: #7FA3D3; --c-cal: #9AAEDB; --c-dep: #7FBBCB; --c-rec: #A3C69C; --c-ink: #0B1722;
      --hero-a: #16406F; --hero-b: #24609F; --glass: rgba(14, 22, 30, .86); --shadow: 0 1px 2px rgba(0, 0, 0, .45), 0 10px 28px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font: 17px/1.5 var(--f-body); }
  h1, h2, h3, p { margin: 0; }
  h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .wrap {
    max-width: 1280px; margin: 0 auto; display: grid; gap: 22px;
    padding-block: 20px 64px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  .lgrp { border-top: 1px dashed var(--line); padding-top: 8px; }
  .lgrp > summary { list-style: none; cursor: pointer; padding-right: 30px; position: relative; }
  .lgrp > summary::-webkit-details-marker { display: none; }
  .lgrp > summary::after { content: ""; position: absolute; right: 4px; top: 50%; width: 8px; height: 8px; margin-top: -6px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); transition: transform .15s; }
  .lgrp[open] > summary::after { transform: rotate(225deg); margin-top: -1px; }
  .sublines { display: grid; gap: 8px; padding: 8px 0 4px 14px; margin-top: 8px; border-left: 3px solid var(--line); }
  .cdet.grp { background: var(--surface-2); }
  .cdet.grp > .cbody { padding: 12px; }
  .statlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .stat { width: 100%; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; justify-content: space-between; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; cursor: pointer; }
  .stat .cs-name { flex: 1 1 170px; }
  .cal { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .mtile { width: 100%; height: 100%; display: grid; gap: 8px; align-content: start; justify-items: start; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; cursor: pointer; }
  .mtile.now { border: 2px solid var(--accent); }
  .mtile.sel { background: var(--accent-soft); }
  .mname { font: 700 18px var(--f-display); text-transform: capitalize; }
  .mtile { padding: 10px 6px; gap: 4px; justify-items: center; text-align: center; }
  .mtile .pill { font-size: 11px; padding: 3px 6px; min-height: 0; }
  .mtile .sum-total { font-size: 11px; letter-spacing: -.02em; }
  .dots { display: flex; gap: 3px; min-height: 8px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .dot.end { background: var(--danger); } .dot.adj { background: var(--warn); } .dot.done { background: var(--ok); }
  .caldet { margin-top: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 10px; }
  .caldet h3 { text-transform: capitalize; }
  .pill.none { background: var(--surface-2); color: var(--muted); }
  .pill.part { background: var(--accent-soft); color: var(--accent); }
  .evs { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
  .ev { padding-left: 14px; position: relative; }
  .ev::before { content: ""; position: absolute; left: 0; top: .55em; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .ev.end { color: var(--danger); font-weight: 700; }
  .ev.end::before { background: var(--danger); }
  .ev.adj::before { background: var(--warn); }
  .ev.done::before { background: var(--ok); }

  /* encabezado */
  .top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  .eyebrow { font: 700 12px/1.2 var(--f-body); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
  .top h1 { font-size: clamp(28px, 6vw, 38px); font-weight: 700; line-height: 1.05; }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .brand.sm { gap: 8px; font-size: 19px; }
  .logo { flex: none; display: block; }
  .lg-bg { fill: var(--accent); }
  .lg-roof, .lg-wall, .lg-ok { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 3.2; }
  .lg-roof, .lg-wall { stroke: var(--accent-ink); }
  .lg-ok { stroke: var(--ok-soft); stroke-width: 3.6; }
  .loading .logo { margin-bottom: 8px; }
  .save { font-size: 14px; color: var(--muted); min-height: 21px; }
  .save[data-state="error"] { color: var(--danger); font-weight: 700; }

  .tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--line); }
  .tab { flex: 1 1 0; min-width: 0; background: none; border: 0; border-bottom: 4px solid transparent; margin-bottom: -2px;
         padding: 12px 8px; min-height: 48px; font-weight: 700; color: var(--muted); cursor: pointer; }
  .tab[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent); }
  @media (min-width: 640px) { .tab { flex: 0 0 auto; padding-inline: 22px; } }

  /* avisos */
  .banner { display: flex; gap: 12px 18px; align-items: center; justify-content: space-between; flex-wrap: wrap;
            background: var(--warn-soft); color: var(--ink); border: 1px solid var(--line); border-left: 6px solid var(--warn);
            border-radius: var(--radius); padding: 14px 16px; }
  .banner p { flex: 1 1 260px; min-width: 0; }
  .banner.info { background: var(--accent-soft); border-left-color: var(--accent); }

  /* botones y campos */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 16px;
         border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 700; font-size: 15px;
         cursor: pointer; text-decoration: none; color: var(--ink); text-align: center; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.ok { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.small { min-height: 38px; padding: 6px 12px; font-size: 14px; }
  .btn.danger { color: var(--danger); }
  .btn[hidden] { display: none; }
  .linkish { background: none; border: 0; padding: 6px 4px; color: var(--accent); text-decoration: underline; cursor: pointer; font-size: 15px; }
  .in { width: 100%; min-height: 44px; padding: 9px 12px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); }
  .in:focus { border-color: var(--accent); }
  textarea.in { min-height: 70px; resize: vertical; }
  .f { display: grid; gap: 6px; min-width: 0; }
  .f > span, .lbl { font-size: 14px; font-weight: 700; color: var(--muted); }
  .help { font-size: 14px; color: var(--muted); }
  .money { display: flex; align-items: center; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); min-width: 0; }
  .money:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .money.invalid { border-color: var(--danger); }
  .money i { font-style: normal; padding-left: 12px; color: var(--muted); font-family: var(--f-mono); }
  .money input { flex: 1; min-width: 0; border: 0; background: transparent; outline: 0; text-align: right;
                 font: 500 18px var(--f-mono); padding: 10px 12px 10px 6px; min-height: 44px; }
  .err { color: var(--danger); font-size: 14px; }

  /* secciones */
  .block { display: grid; gap: 14px; }
  .block-head { display: grid; gap: 4px; }
  .block-head h2 { font-size: 26px; line-height: 1.15; }
  .hint { color: var(--muted); max-width: 68ch; }

  .monthbar { display: grid; grid-template-columns: 52px 1fr 52px; align-items: center; gap: 8px; }
  .monthbar .btn { min-height: 52px; font-size: 24px; padding: 0; }
  .month-title { text-align: center; display: grid; justify-items: center; }
  .month-title h2 { font-size: clamp(26px, 6vw, 34px); }

  /* resumen */
  .sum { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; display: grid; gap: 18px; }
  .sum-main { display: grid; gap: 2px; }
  .sum-main strong { font: 700 clamp(34px, 8vw, 52px)/1.05 var(--f-display); letter-spacing: -.01em; overflow-wrap: anywhere; }
  .sum-parts { margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px 18px; }
  .sum-parts div { min-width: 0; }
  .sum-parts dt { font-size: 14px; color: var(--muted); font-weight: 700; }
  .sum-parts dd { margin: 0; font: 500 18px var(--f-mono); overflow-wrap: anywhere; }
  .sum-parts small { display: block; font: 400 14px var(--f-body); color: var(--muted); }
  .bar { height: 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
  .bar span { display: block; height: 100%; width: 0; background: var(--ok); transition: width .25s ease; }
  .note { padding: 10px 12px; border-radius: 8px; background: var(--surface-2); font-size: 15px; }
  .sigpad { display: block; width: 100%; max-width: 560px; aspect-ratio: 700 / 240; background: #fff; border: 1.5px dashed var(--line); border-radius: 10px; touch-action: none; cursor: crosshair; }
  .sig-prev { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; display: inline-block; max-width: 100%; }
  .sig-prev img { display: block; max-height: 90px; max-width: 100%; }
  .note.autoadj { background: var(--accent-soft); }
  .note.warn { background: var(--warn-soft); color: var(--warn); font-weight: 700; }

  /* facturas */
  .quickadd { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .quickadd .lbl { margin-right: 4px; }
  .bills { display: grid; gap: 14px; }
  .bill { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 14px; }
  .bill-head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 230px) auto; gap: 12px; align-items: end; }
  @media (max-width: 640px) { .bill-head { grid-template-columns: 1fr; } }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 16px; min-height: 42px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .chip[aria-pressed="true"]::before { content: "\2713\00a0"; }
  .chips-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .split { display: flex; gap: 14px 24px; flex-wrap: wrap; align-items: center; justify-content: space-between; border-top: 1px dashed var(--line); padding-top: 12px; }
  .stepper { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .stepper b { font: 600 20px var(--f-mono); min-width: 1.5ch; text-align: center; }
  .stepper .btn { min-width: 44px; padding: 0; font-size: 22px; }
  .binfo { font-size: 15px; flex: 1 1 280px; min-width: 0; }
  .binfo.warn { color: var(--warn); font-weight: 700; }
  .empty { border: 2px dashed var(--line); border-radius: var(--radius); padding: 22px; color: var(--muted); text-align: center; display: grid; gap: 12px; justify-items: center; }
  .empty h3 { color: var(--ink); font-size: 22px; }

  /* tarjeta-comprobante */
  .stubs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 16px; align-items: start; }
  .stub { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); display: flex; flex-direction: column; min-width: 0; }
  .stub-head { padding: 16px 16px 12px; display: grid; gap: 10px; }
  .stub-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
  .stub-head h3 { font-size: 24px; line-height: 1.15; overflow-wrap: anywhere; }
  .tenant { color: var(--muted); font-size: 15px; overflow-wrap: anywhere; }
  .stamp { font: 600 14px var(--f-mono); color: var(--stamp); letter-spacing: .02em; white-space: nowrap; }
  .pill { display: inline-block; font: 700 12px/1 var(--f-body); letter-spacing: .06em; text-transform: uppercase; padding: 7px 10px; border-radius: 999px; }
  .pill.paid { background: var(--ok-soft); color: var(--ok); }
  .pill.pending { background: var(--warn-soft); color: var(--warn); }
  .lines { padding: 4px 16px 14px; display: grid; gap: 10px; }
  .line { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .line.rent { align-items: center; }
  .line .ln { min-width: 0; display: grid; }
  .line .ln small { color: var(--muted); font-size: 14px; }
  .line .amt { font: 500 17px var(--f-mono); white-space: nowrap; }
  .rent-in { width: 190px; max-width: 55%; }
  .perf { border-top: 2px dashed var(--line); margin: 0 12px; }
  .total { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 14px 16px 6px; }
  .total span { font-weight: 700; }
  .total strong { font: 700 28px var(--f-display); overflow-wrap: anywhere; text-align: right; }
  .pay { padding: 8px 16px; display: grid; gap: 10px; }
  .pay-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .actions { padding: 8px 16px 16px; display: flex; flex-wrap: wrap; gap: 8px; }
  .actions .btn { flex: 1 1 auto; }
  .obs { padding: 0 16px 16px; }

  /* departamentos y ajustes */
  .plist { display: grid; gap: 14px; }
  .svcbox { display: grid; gap: 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
  .svrow { display: grid; gap: 10px; padding-bottom: 12px; border-bottom: 1px dashed var(--line); justify-items: start; }
  .svrow .f { width: 100%; }
  .duenow { margin: 0; color: var(--accent); }
  .duelist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .duelist li { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
  .duelist li span { color: var(--accent); font-weight: 700; }
  .photobox { display: grid; gap: 10px; }
  .phs { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 10px; }
  .phs li { display: grid; gap: 6px; justify-items: start; }
  .phs img { width: 110px; height: 110px; object-fit: cover; border-radius: 12px; border: 1px solid var(--line); display: block; }
  .dsrows { display: grid; gap: 8px; padding: 12px; }
  .dsr { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; text-align: left; width: 100%; min-height: 52px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font: inherit; cursor: pointer; }
  .dsr .dsn { font-weight: 700; } .dsr .dsn small { font-weight: 400; color: var(--muted); }
  .dsr .dsl { font-size: 14px; font-weight: 700; }
  .dsr.ok .dsl { color: var(--muted); }
  .dsr.noamt { border-left: 5px solid var(--warn); } .dsr.noamt .dsl { color: var(--warn); }
  .dsr.missing { border-left: 5px solid var(--danger); } .dsr.missing .dsl { color: var(--danger); }
  .rclist { display: grid; gap: 10px; padding: 12px; }
  .rcrow { display: grid; gap: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
  .rcn { display: grid; min-width: 0; } .rcn b { overflow-wrap: anywhere; } .rcn small { color: var(--muted); }
  .rcbox { display: grid; gap: 10px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
  .rcbox b { font-size: 17px; }
  .rcbox .actions { display: grid; gap: 8px; }
  .btn.wa { text-align: center; text-decoration: none; }
  .wabox { display: grid; gap: 10px; margin-top: 14px; padding: 14px; border-radius: var(--radius); border: 1px solid color-mix(in srgb, var(--c-cobros) 45%, var(--line)); background: color-mix(in srgb, var(--c-cobros) 8%, var(--surface)); }
  .wabox h4 { margin: 0; font-size: 16px; }
  .wabox textarea { min-height: 110px; }
  .wabox .chip { min-height: 38px; padding: 6px 14px; font-size: 14px; }
  .wabox .wa-btns { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill.short { background: var(--bad-soft); color: var(--danger); }
  .line.carry, .line.carry b, .line.carry small { color: var(--danger); }
  .shortbox { display: grid; gap: 10px; border: 1px dashed var(--line); border-radius: var(--radius); padding: 14px; }
  .shortbox h4 { margin: 0; font-size: 17px; }
  .shrow { display: grid; gap: 6px; justify-items: start; padding-bottom: 10px; border-bottom: 1px solid var(--line); }

function applyIcl(id) {

  c.history.push({ date: k.date, effKey: effKey, base: base, icl: icl, oldRent: oldRent, newRent: k.rent, prevLast: c.lastAdj, prevBase: base });
  p.rent = k.rent; c.lastAdj = k.date; c.baseIcl = icl;

function undoIcl(id) {

function tweenMoney(el, to) {

  var calm = false; try { calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
  if (from === undefined) from = S.ui.enter ? 0 : to;
  if (calm || from === to) { el.textContent = fmt(to, true); return; }
  var t0 = performance.now();
  (function step(t) {
    var p = Math.min(1, (t - t0) / 520), e = 1 - Math.pow(1 - p, 3);
    el.textContent = fmt(Math.round(from + (to - from) * e), true);
    if (p < 1) el._raf = requestAnimationFrame(step); else el.textContent = fmt(to, true);
  })(t0);
}

    img.onload = function () {

        var cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(img, 0, 0);

    });
    var ck = 'h:' + p.id, op = S.ui.openC && S.ui.openC[ck];
    var body = list.length ? list.slice(0, 36).map(function (x) {
      var pill = x.r.paid ? (x.r.shortTotal > 0 ? '<span class="pill short">Falta ' + fmt(x.r.shortTotal) + '</span>' : '<span class="pill paid">Cobrado</span>') : '<span class="pill pending">Pendiente</span>';
      var det = x.r.paid && x.pd ? 'Pagó el ' + isoToAR(x.pd.date || '') + ' · ' + esc(x.pd.method || 'Transferencia') : 'Total ' + fmt(x.r.total);
      return '<div class="hrow"><b>' + esc(monthLabel(x.k)) + '</b><span>' + pill + ' ' + fmt(x.r.total) + '</span><small>' + det + (x.r.paid && x.pd && x.pd.shortNote ? ' · ' + esc(x.pd.shortNote) : '') + '</small></div>';
    }).join('') : '<p class="help">Todavía no hay meses cargados para este departamento.</p>';
    return '<details class="cdet" data-cid="' + ck + '"' + (op ? ' open' : '') + '><summary><span class="csum bs"><span class="cs-name"><b>' + esc(p.name || 'Sin nombre') + '</b><span class="tenant">' + esc(p.tenant || 'Sin inquilino') + '</span></span>' +
      (unpaid ? '<span class="pill late">' + unpaid + (unpaid === 1 ? ' mes sin cobrar' : ' meses sin cobrar') + '</span>' : (list.length ? '<span class="pill paid">Al día</span>' : '')) + '</span></summary><div class="cbody"><p class="help">' + paidN + ' de ' + list.length + ' meses cobrados.</p>' + body + '</div></details>';
  }).join('');
  return '<section class="block">' + head + table + csvBtn + '</section>' + '<section class="block">' + gastos + '</section>' +
    '<section class="block"><div class="block-head"><h2>Historial por departamento</h2><p class="hint">Todos los meses de cada inquilino: qué pagó, cuándo y cómo. Sirve si hay un reclamo.</p></div><div class="clist">' + (hist || '<p class="help">Cargá un departamento para ver su historial.</p>') + '</div></section>';
}
function resumenCsv(year) {
  var cache = {}, L = ['Mes;Cobrado;Facturas de servicios;Gastos;Resultado'], T = [0, 0, 0, 0];
  function n(c) { return (c / 100).toFixed(2).replace('.', ','); }
  function q(s) { return '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"'; }
  for (var mo = 1; mo <= 12; mo++) {
    var key = year + '-' + pad(mo); if (!S.months[key]) continue;
    var st = monthStats(key, cache); L.push([q(monthLabel(key)), n(st.paid), n(st.bills), n(st.exp), n(st.net)].join(';'));
    T[0] += st.paid; T[1] += st.bills; T[2] += st.exp; T[3] += st.net;
  }
  L.push([q('Total ' + year), n(T[0]), n(T[1]), n(T[2]), n(T[3])].join(';'), '', 'Gastos;Mes;Departamento;Importe');
  Object.keys(S.months).sort().forEach(function (k) {
    if (k.slice(0, 4) !== String(year)) return;
    (S.months[k].expenses || []).forEach(function (x) { var pr = x.pid && findProp(x.pid); L.push([q(x.concept), q(monthLabel(k)), q(pr ? pr.name : 'General'), n(x.amount || 0)].join(';')); });
  });
  return '﻿' + L.join('\r\n');
}

/* ---------------------------------------------------------------- otros vencimientos (seguros, ABL, expensas...) */
function remNext(r) {
  if (!r.date) return '';
  var d = r.date, g = 0;
  if (r.every > 0) while (daysBetween(todayISO(), d) < 0 && g++ < 600) d = addMonths(d, r.every);
  return d;
}
function remindersCard() {
  var list = S.config.reminders || [], ro = RD(), dis = RO() ? ' disabled' : '';
  var rows = list.map(function (r) {
    var nx = remNext(r);
    return '<div class="card remrow"><div class="grid2">' +
      '<label class="f"><span>Qué vence</span><input class="in" data-f="rem.title" data-id="' + r.id + '" data-fid="rem:' + r.id + '" value="' + esc(r.title) + '" placeholder="Ej.: Seguro de la casa"' + ro + '></label>' +
      '<label class="f"><span>Fecha</span><input class="in" type="date" data-f="rem.date" data-id="' + r.id + '" value="' + esc(r.date) + '"' + dis + '></label>' +
      '<label class="f"><span>Se repite</span><select class="in" data-f="rem.every" data-id="' + r.id + '"' + dis + '>' +
      [[0, 'Una sola vez'], [1, 'Todos los meses'], [3, 'Cada 3 meses'], [6, 'Cada 6 meses'], [12, 'Todos los años']].map(function (o) { return '<option value="' + o[0] + '"' + (+r.every === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select></label>' +
      '<label class="f"><span>Departamento (opcional)</span><select class="in" data-f="rem.pid" data-id="' + r.id + '"' + dis + '><option value="">Ninguno</option>' +
      S.config.props.map(function (p) { return '<option value="' + p.id + '"' + (r.pid === p.id ? ' selected' : '') + '>' + esc(p.name || 'Sin nombre') + '</option>'; }).join('') + '</select></label></div>' +
      '<div class="row-actions">' + (nx && r.every > 0 ? '<span class="help">Próxima vez: ' + isoToAR(nx) + '</span>' : '') + (RO() ? '' : '<button type="button" class="btn small danger" data-act="rem-del" data-id="' + r.id + '">Quitar</button>') + '</div></div>';
  }).join('');
  return '<section class="block"><div class="block-head"><h2>Otros vencimientos</h2><p class="hint">Seguros, ABL, expensas, impuestos... Cargalos una vez y aparecen en el calendario y en Novedades cuando se acercan.</p></div>' +
    (rows || '<p class="help">Todavía no cargaste ninguno.</p>') + (RO() ? '' : '<div><button type="button" class="btn primary" data-act="rem-add">+ Agregar vencimiento</button></div>') + '</section>';
}

/* ---------------------------------------------------------------- Novedades: avisos con acción directa */
function waRentHref(pid, key, late) {
  var p = findProp(pid); if (!p) return 'https://wa.me/';
  var c = compute(key), r = c.rows[pid], o = S.config.owner, digits = String(p.phone || '').replace(/\D/g, ''), first = (p.tenant || '').trim().split(/\s+/)[0] || '', due = rentDueISO(p, key);
  var what = 'el alquiler de ' + monthLabel(key) + ' de ' + (p.name || 'tu departamento');
  var msg = 'Hola' + (first ? ' ' + first : '') + ', ' + (late ? 'te escribo porque ' + what + ' venció el ' + isoToAR(due) + ' y todavía no figura pagado.' : 'te recuerdo que ' + what + ' vence el ' + isoToAR(due) + '.') +
    (r ? ' El total a transferir es ' + fmt(r.total, true) + '.' : '') + (o.alias ? ' Alias: ' + o.alias + '.' : '') + ' Cualquier duda me avisás. ¡Gracias!';
  return 'https://wa.me/' + (digits.length >= 8 ? digits : '') + '?text=' + encodeURIComponent(msg);
}
function quickCalc(p) {
  var au = autoAdj(p), base = baseOf(p); if (!au || !au.ok || !base) return null;
  var iclN = parseIcl(fmtIcl(au.icl)); if (!iclN) return null;
  return { date: au.date, icl: fmtIcl(au.icl), oldRent: p.rent || 0, newRent: iclRent(p.rent || 0, base, iclN) };
}
function newsExtra(x) {
  var out = '';
  if (x.wa) out += '<a class="btn small" target="_blank" rel="noopener" href="' + esc(waRentHref(x.wa.pid, x.wa.key, x.wa.late)) + '">Recordar por WhatsApp</a>';
  if (x.quick) {
    var p = findProp(x.quick), q = p && quickCalc(p);
    if (q) out += S.ui.confirm === 'iclq:' + p.id
      ? '<span class="nwq">¿Pasar el alquiler de ' + fmt(q.oldRent) + ' a <b>' + fmt(q.newRent) + '</b> desde ' + esc(monthLabel(q.date.slice(0, 7))) + '?</span><button type="button" class="btn small primary" data-act="iclq-yes" data-id="' + p.id + '">Sí, aplicar</button><button type="button" class="btn small" data-act="confirm-no">No</button>'
      : '<button type="button" class="btn small" data-act="iclq-ask" data-id="' + p.id + '">Aplicar el aumento ahora</button>';
  }
  return out ? '<div class="nwxs">' + out + '</div>' : '';
}
function stepsCard() {
  var c = S.config; if (!c || S.demo || RO() || c.settings.hideSteps) return '';
  var o = c.owner, ps = c.props.filter(function (p) { return !p.archived; });
  var st = [
    { ok: !!String(o.name || '').trim(), t: 'Escribí tu nombre', s: 'Sale impreso en cada recibo.', tab: 'ajustes', cta: 'Ir a Ajustes' },
    { ok: !!o.signature, t: 'Dibujá tu firma', s: 'Con el dedo, una sola vez. Así los recibos salen firmados.', tab: 'ajustes', cta: 'Ir a Ajustes' },
    { ok: ps.length > 0, t: 'Cargá tu primer departamento', s: 'Nombre, inquilino y alquiler.', tab: 'deptos', cta: 'Ir a Departamentos' },
    { ok: ps.some(function (p) { return (p.svcs || []).length; }), t: 'Elegí qué servicios paga cada uno', s: 'Luz, gas, agua... así la app te avisa cuando falta cargar uno.', tab: 'deptos', cta: 'Ir a Departamentos' }
  ];
  var done = st.filter(function (x) { return x.ok; }).length; if (done === st.length) return '';
  var next = -1; st.some(function (x, i) { if (!x.ok) { next = i; return true; } });
  return '<section class="block steps"><div class="block-head"><h2>Primeros pasos</h2><p class="hint">Vas ' + done + ' de ' + st.length + '. Son datos que cargás una sola vez; después la app hace casi todo.</p></div><ol class="stps">' +
    st.map(function (x, i) {
      return '<li class="stp' + (x.ok ? ' ok' : '') + (i === next ? ' now' : '') + '"><span class="stp-n">' + (x.ok ? '&#10003;' : (i + 1)) + '</span><span class="stp-t"><b>' + x.t + '</b><small>' + x.s + '</small></span>' +
        (i === next ? '<button type="button" class="btn small primary" data-act="go" data-tab="' + x.tab + '">' + x.cta + '</button>' : '') + '</li>';
    }).join('') + '</ol><div><button type="button" class="linkish" data-act="steps-hide">Ocultar esta guía</button></div></section>';
}

boot();
})();
